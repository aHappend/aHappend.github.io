      <path d="M945 182C976 158 1010 158 1032 172C1053 151 1086 157 1102 179C1134 171 1163 190 1176 198Z" opacity=".65"/>
    </g>
    <g filter="url(#coast-paint)">
      <path d="M-120 328C339 313 474 317 665 315C933 312 1182 323 1620 310V950H-120Z" fill="url(#coast-sea)" opacity=".84"/>
      <path d="M-120 322C174 290 238 292 302 271C367 263 397 283 430 291C489 300 526 308 587 319Z" fill="#a9bdb2" opacity=".67"/>
      <path d="M-120 300C103 299 173 226 224 231C264 216 298 250 333 266C376 270 407 311 460 323C488 333 511 349 536 365C510 377 479 389 448 403L-120 455Z" fill="url(#coast-headland)"/>
      <path d="M-120 351C70 355 167 277 216 277C266 277 318 306 354 333C387 346 426 352 459 370C450 388 442 398 429 405L-120 455Z" fill="#789284" opacity=".53"/>
      <path d="M-120 392C70 392 164 338 203 330C243 334 269 352 294 364C327 368 369 378 397 392C415 395 431 398 445 400L387 435L-120 475Z" fill="#b7b397" opacity=".65"/>
      <path d="M110 343C171 318 203 303 243 315M182 366C241 368 263 387 317 395M269 343C311 360 335 375 368 377M139 405C200 390 239 408 281 415" stroke="#bcc7a1" stroke-width="12" opacity=".27" stroke-linecap="round" filter="url(#coast-wet)"/>
      <path d="M169 355C183 372 182 386 201 391M269 365C274 383 290 403 302 413M347 382C351 403 365 417 381 423" stroke="#7c8a79" stroke-width="3" opacity=".27"/>
      <path d="M-120 437C257 416 303 387 446 410C566 418 584 480 734 507C869 530 897 592 1054 623C1194 650 1310 662 1620 700V950H-120Z" fill="url(#coast-sand)"/>
      <path d="M396 388C531 399 559 451 700 479C854 507 886 566 1036 602C1152 627 1262 642 1399 676C1221 657 1106 632 983 615C850 584 792 541 671 518C548 493 488 423 396 412Z" fill="url(#coast-shallows)" opacity=".8"/>
      <path d="M343 419C474 394 550 466 674 508C831 543 882 589 1007 621C1130 654 1261 668 1406 710C1202 678 1071 656 950 632C803 600 746 554 627 532C510 493 464 431 343 435Z" fill="#bba890" opacity=".21"/>
      <path d="M162 600C360 554 478 591 613 638C733 675 823 673 944 704C806 707 699 729 528 687C345 640 250 656 138 681Z" fill="#d5bf99" opacity=".19"/>
    </g>

    <g stroke="#edf8ef" stroke-linecap="round" filter="url(#coast-wet)">
      <path d="M411 406C469 408 495 431 535 450C578 475 620 489 670 502C735 515 764 533 814 554C884 590 945 604 1007 619C1088 642 1184 649 1284 678" stroke-width="7" opacity=".82"/>
      <path d="M519 396C592 414 623 444 701 460C779 478 851 506 905 534C981 560 1040 575 1123 592" stroke-width="4.3" opacity=".62"/>
      <path d="M653 380C739 386 795 408 861 421C959 436 1010 458 1101 472C1176 481 1232 494 1316 503" stroke-width="2.7" opacity=".55"/>
      <path d="M898 352L975 355M1012 358L1117 361M1200 364L1338 369M522 337L586 336M679 336L782 339" stroke-width="1.8" opacity=".56"/>
    </g>
    <g stroke="#fcfbec" stroke-linecap="round" opacity=".64">
      <path d="M468 426L484 432M509 444L524 453M553 471L566 475M593 487L612 491M651 507L672 510M719 525L737 532M772 548L784 553M844 580L863 586M925 609L944 613M999 632L1035 639" stroke-width="2.6"/>
      <path d="M756 474L782 481M841 506L859 511M939 545L976 555M1084 586L1111 591M1224 649L1256 657" stroke-width="1.6"/>
    </g>
    <g stroke="#508f9c" stroke-width="1.2" opacity=".25" stroke-linecap="round">
      <path d="M754 348L817 350M1068 379L1155 383M1151 418L1190 422M965 431L1009 439M1311 447L1349 451"/>
      <path d="M585 366L611 369M903 365L943 366M1246 342L1296 344"/>
    </g>

    <g opacity=".9">
      <use href="#coast-stone" transform="translate(239 607) rotate(-9) scale(1.15 .85)"/>
      <use href="#coast-stone" transform="translate(290 626) rotate(12) scale(.62 .54)"/>
      <use href="#coast-stone" transform="translate(206 635) rotate(8) scale(.48 .41)"/>
      <use href="#coast-stone" transform="translate(1272 701) rotate(-15) scale(.53 .44)" opacity=".7"/>
    </g>
    <g opacity=".82">
      <use href="#coast-grass" transform="translate(150 708) rotate(-8) scale(1.14 .94)"/>
      <use href="#coast-grass" transform="translate(237 728) rotate(8) scale(.61 .76)"/>
      <use href="#coast-grass" transform="translate(1323 742) rotate(17) scale(-.78 .84)"/>
    </g>
    <g fill="#baa785" opacity=".5" filter="url(#coast-paint)">
      <ellipse cx="360" cy="666" rx="3.5" ry="1.6"/><ellipse cx="395" cy="679" rx="1.7" ry="1"/>
      <ellipse cx="539" cy="631" rx="2.4" ry="1.1"/><ellipse cx="931" cy="711" rx="3" ry="1.7"/>
      <ellipse cx="958" cy="699" rx="1.5" ry=".9"/><ellipse cx="1073" cy="735" rx="2.1" ry="1.2"/>
    </g>
    <g transform="translate(721 696) rotate(-16)" filter="url(#coast-paint)">
      <path d="M-13 5C-17-7-7-15 1-14C13-16 18-6 14 5L2 11Z" fill="#f6ebcf"/>
      <path d="M1 9L-10-4M2 8L-3-10M3 7L4-11M4 8L11-4" stroke="#c0aa83" stroke-width=".8" opacity=".67"/>
    </g>
    <g stroke="#718f95" stroke-width="1.7" opacity=".49" stroke-linecap="round">
      <path d="M913 211C922 202 932 205 937 212C943 205 953 202 962 204"/>
      <path d="M986 191C993 185 1001 188 1004 193C1009 187 1018 185 1024 187" stroke-width="1.2" opacity=".72"/>
    </g>
  </g>
</svg>
