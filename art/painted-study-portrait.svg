        <path stroke="#eaf2eb" stroke-width="3" opacity=".64" d="m173 516 14-37 24 41-18-8-12 35m362-132 15-43 21 57-19-22-12 34"/>
        <path stroke="#729daa" stroke-width="1.5" opacity=".5" d="M280 1035h73m39 16h43m-215 42h87m75 31h137m-326 27h74"/>
        <path stroke="#497a80" stroke-width="1.8" opacity=".58" d="M84 1220q-2-111 12-197m-10 145-22-27m26-18 19-29m530 126q0-113 8-190m-7 139 24-31m-22-14-18-33"/>
        <path stroke="#607d8d" stroke-width="1.8" opacity=".44" d="m292 321 12-7 12 7m29-33 10-5 10 5"/>
