        <path fill="url(#portrait-far)" opacity=".63" d="m22 914 78-157 58 24 64-161 54 96 58-30 59 191 83-163 57 81 45-147 57 89 65 154v247H22Z"/>
        <path fill="url(#portrait-near)" d="m22 888 62-119 70 72 63-47 64 147 64 46-52 91-136 94-129 43Z"/>
        <path fill="url(#portrait-near)" d="m698 849-55-148-62 79-49-38-59 180-74 70 89 71 107 60 102 71Z"/>
        <path fill="url(#portrait-water)" d="M248 984C318 965 393 977 457 991L616 1204C489 1176 474 1236 354 1211S164 1225 99 1187Z"/>
        <path fill="#ab916a" opacity=".23" d="M26 1200C157 1138 195 1192 288 1165S414 1212 484 1172 619 1202 696 1173L696 1270H26Z"/>
        <path fill="#48777d" opacity=".34" d="m58 1218 12-113 13 42 10-152 17 153 17-59 7 150Zm552 18 11-119 12 45 14-158 12 167 14-58 9 135Z"/>
      </g>
      <g fill="none" stroke-linecap="round">
