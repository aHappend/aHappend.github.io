<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" fill="none">
  <title>Still water, waking lilies</title>
  <desc>An original watercolor pond garden: tall irises and reeds gather along the left bank, while ivory and blush water lilies recede diagonally across open water toward a hovering dragonfly. Veined pads, reflections, and ripples dissolve into a transparent background.</desc>
