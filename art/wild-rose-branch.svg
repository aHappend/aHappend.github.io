      <use href="#rose-silver-leaf" transform="translate(348 526) rotate(101) scale(1.15)"/>
      <use href="#rose-silver-leaf" transform="translate(520 352) rotate(49) scale(1.08)"/>
      <use href="#rose-silver-leaf" transform="translate(677 258) rotate(-42) scale(.84)"/>
      <use href="#rose-silver-leaf" transform="translate(870 181) rotate(87) scale(.84)"/>
    </g>
    <g>
      <use href="#rose-leaflet" transform="translate(222 549) rotate(-40) scale(1.06)"/>
      <use href="#rose-leaflet" transform="translate(295 567) rotate(76) scale(.96)"/>
      <use href="#rose-leaflet" transform="translate(328 546) rotate(41) scale(.87)"/>
      <use href="#rose-leaflet" transform="translate(394 476) rotate(-19) scale(1.13)"/>
      <use href="#rose-leaflet" transform="translate(428 455) rotate(96) scale(.88)"/>
      <use href="#rose-leaflet" transform="translate(470 398) rotate(-58) scale(.9)"/>
      <use href="#rose-leaflet" transform="translate(497 376) rotate(66) scale(.93)"/>
      <use href="#rose-leaflet" transform="translate(582 301) rotate(-34) scale(.84)"/>
      <use href="#rose-leaflet" transform="translate(702 267) rotate(125) scale(.77)"/>
      <use href="#rose-leaflet" transform="translate(743 237) rotate(-13) scale(.88)"/>
      <use href="#rose-leaflet" transform="translate(812 204) rotate(157) scale(.79)"/>
      <use href="#rose-leaflet" transform="translate(929 157) rotate(53) scale(.7)"/>
      <use href="#rose-leaflet" transform="translate(928 211) rotate(-70) scale(.6)"/>
      <use href="#rose-silver-leaf" transform="translate(270 390) rotate(43) scale(.78)"/>
      <use href="#rose-silver-leaf" transform="translate(570 253) rotate(-48) scale(.81)"/>
    </g>
    <use href="#rose-open" transform="translate(285 341) rotate(-12) scale(1.02)"/>
    <use href="#rose-cup" transform="translate(362 252) rotate(-29) scale(.87)"/>
    <use href="#rose-open" transform="translate(611 155) rotate(23) scale(1.08)"/>
    <use href="#rose-open" transform="translate(816 345) rotate(7) scale(.91)"/>
    <use href="#rose-cup" transform="translate(946 112) rotate(23) scale(.8)"/>
    <use href="#rose-bud" transform="translate(840 83) rotate(27) scale(.89)"/>
    <use href="#rose-bud" transform="translate(967 266) rotate(139) scale(.92)"/>
    <use href="#rose-bud" transform="translate(534 451) rotate(33)"/>
    <use href="#rose-bud" transform="translate(175 463) rotate(-37) scale(.78)"/>
    <use href="#rose-bud" transform="translate(765 396) rotate(177) scale(.7)"/>
    <g transform="translate(374 439) rotate(-14)">
      <ellipse rx="7" ry="9" fill="#b86854"/><path d="M0-8V8" stroke="#665f51" stroke-width="1.1"/>
      <circle cy="-9" r="3.1" fill="#616952"/><g fill="#675f52"><circle cx="-3" cy="-3" r="1.4"/><circle cx="3" cy="2" r="1.4"/><circle cx="-2.7" cy="4" r="1.2"/></g>
    </g>
  </g>
</svg>
